<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="violaciao — singer, dancer, and AI consultant in New York.">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f3f1ec">
    <meta property="og:title" content="violaciao">
    <meta property="og:description" content="Singer, dancer, and AI consultant in New York.">
    <meta property="og:type" content="website">
    <title>violaciao</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Caveat       — handwriting/script font for the wordmark only
      Inter        — clean grotesk for everything else
    -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Fira+Code:wght@400;500&family=Inter:ital,wght@0,300;0,400;1,300&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ── Reset ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html {
            height: 100%;
            background: #f3f1ec;
            color-scheme: light;
        }
        body {
            height: 100%;
            background: #f3f1ec;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        a { color: inherit; text-decoration: none; }


        /* ═══════════════════════════════════════════
           LANDING PAGE
        ═══════════════════════════════════════════ */

        #landing {
            position: relative;
            min-height: 100vh;
            min-height: 100dvh;
            background: #f3f1ec;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
        }


        /* ── Header ── */

        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(1.1rem, 3.5vh, 2.2rem) clamp(1.4rem, 5vw, 3.8rem);
            flex-shrink: 0;
        }

        .header-mark {
            font-family: 'Manrope', sans-serif;
            font-size: clamp(1.8rem, 2.3vw, 2.5rem);
            font-weight: 500;
            color: #1a1a1a;
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .site-nav {
            display: flex;
            gap: clamp(0.6rem, 1.2vw, 1rem);
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-0.35rem);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        #landing.nav-open .site-nav {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .site-nav a {
            font-family: 'Courier Prime', 'Courier New', Courier, monospace;
            font-size: clamp(0.78rem, 1.1vw, 0.9rem);
            letter-spacing: 0.06em;
            color: rgba(26, 26, 26, 0.45);
            transition: color 0.2s;
        }

        .site-nav a:hover {
            color: #1a1a1a;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .site-nav .nav-featured {
            font-weight: 700;
        }


        /* ── Hero ── */

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 clamp(1rem, 5vw, 3rem);
            gap: clamp(1rem, 2.5vh, 1.8rem);
        }

        /* Typewriter illustration container */
        .typewriter-wrap {
            position: relative;
            width: clamp(300px, 62vw, 560px);
            flex-shrink: 0;
        }

        .typewriter-svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .typewriter-lever {
            transform-box: fill-box;
            transform-origin: 10% 90%;
        }

        .typewriter-wrap.is-lever-pulled .typewriter-lever {
            animation: leverPull 0.32s ease-out;
        }

        .typewriter-lever-toggle {
            position: absolute;
            top: 14%;
            right: 0;
            width: 13%;
            height: 18%;
            border: 0;
            padding: 0;
            background: transparent;
            cursor: pointer;
            z-index: 2;
        }

        .typewriter-lever-toggle:focus-visible {
            outline: 2px solid rgba(26, 26, 26, 0.55);
            outline-offset: 3px;
            border-radius: 999px;
        }

        /* Hero text — sits on the paper */
        .hero-statement {
            position: absolute;
            /* paper center: x=240/480=50%, y=58/310=18.7% */
            top: 19%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            white-space: nowrap;
            font-family: 'Courier Prime', 'Courier New', Courier, monospace;
            font-size: clamp(0.62rem, 1.85vw, 1rem);
            font-weight: 400;
            letter-spacing: 0.02em;
            line-height: 1.3;
            color: #231a0e;   /* warm dark ink */
            filter: url(#ink);
            text-shadow:
                0.4px  0.3px 0 rgba(35,26,14,0.12),
                -0.3px 0.2px 0 rgba(35,26,14,0.08),
                0.2px -0.2px 0 rgba(35,26,14,0.06);
        }

        #typeword { display: inline; }

        /* Blinking bar cursor */
        .cursor {
            display: inline-block;
            width: 0.06em;
            min-width: 1px;
            height: 0.8em;
            background: #231a0e;
            margin: 0 0.03em 0 0.02em;
            vertical-align: -0.04em;
            animation: blink 0.95s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }


        /* ── Footer ── */

        .site-footer {
            position: relative;
            z-index: 1;
            flex-shrink: 0;
            padding: clamp(2.9rem, 8vh, 5rem) clamp(1.4rem, 5vw, 3.8rem) clamp(0.9rem, 2.5vh, 1.5rem);
            font-size: 0.72rem;
            color: rgba(26, 26, 26, 0.28);
            letter-spacing: 0.06em;
            text-align: center;
        }

        .tree-hollow-scene {
            position: absolute;
            left: clamp(0.35rem, 1.7vw, 1.6rem);
            bottom: clamp(0.65rem, 2.4vh, 1.5rem);
            width: clamp(112px, 14vw, 190px);
            z-index: 3;
            opacity: 0;
            pointer-events: none;
            transform: translateY(0.3rem);
            transition: opacity 0.24s ease, transform 0.24s ease;
        }

        .tree-hollow-scene.is-unlocked {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .tree-button {
            display: block;
            width: 100%;
            border: 0;
            padding: 0;
            background: transparent;
            color: #1a1a1a;
            cursor: pointer;
        }

        .tree-button:focus-visible {
            outline: 2px solid rgba(26, 26, 26, 0.55);
            outline-offset: 5px;
            border-radius: 12px;
        }

        .tree-image {
            display: block;
            width: 100%;
            height: auto;
            opacity: 0.5;
            transition: transform 0.18s ease, opacity 0.18s ease;
        }

        .tree-button:hover .tree-image,
        .tree-button:focus-visible .tree-image {
            transform: scale(1.025);
            opacity: 1;
        }

        .tree-hollow-scene.is-solved .tree-image {
            animation: hollowPulse 0.9s ease-in-out;
        }

        .hollow-panel {
            position: absolute;
            left: min(62%, 160px);
            bottom: 53%;
            width: min(330px, 78vw);
            padding: 0.85rem;
            border: 1.5px solid #1a1a1a;
            border-radius: 7px;
            background: #faf9f5;
            box-shadow: 5px 5px 0 rgba(26, 26, 26, 0.08);
            font-family: 'Courier Prime', 'Courier New', Courier, monospace;
            opacity: 0;
            transform: translateY(7px);
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .hollow-panel[hidden] {
            display: none;
        }

        .hollow-panel.is-open {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .hollow-panel.is-wrong {
            animation: morseWiggle 0.24s ease-in-out;
        }

        .hollow-panel.is-complete .hollow-answer,
        .hollow-panel.is-complete .hollow-actions {
            display: none;
        }

        .hollow-panel::before {
            content: "";
            position: absolute;
            left: 1.2rem;
            bottom: -0.45rem;
            width: 0.8rem;
            height: 0.8rem;
            background: #faf9f5;
            border-right: 1.5px solid #1a1a1a;
            border-bottom: 1.5px solid #1a1a1a;
            transform: rotate(45deg);
        }

        .hollow-title {
            margin: 0;
            font-size: 0.84rem;
            color: #1a1a1a;
        }

        .hollow-note {
            margin: 0.42rem 0 0;
            font-size: 0.7rem;
            line-height: 1.35;
            color: rgba(26, 26, 26, 0.58);
        }

        .hollow-form {
            margin-top: 0.7rem;
        }

        .hollow-answer {
            width: 100%;
            border: 1px solid rgba(26, 26, 26, 0.42);
            border-radius: 4px;
            background: #fffdf8;
            color: #1a1a1a;
            font: inherit;
            font-size: 0.78rem;
        }

        .hollow-answer {
            padding: 0.46rem 0.5rem;
        }

        .hollow-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.7rem;
            margin-top: 0.55rem;
        }

        .hollow-submit {
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            background: #1a1a1a;
            color: #faf9f5;
            padding: 0.42rem 0.58rem;
            font: inherit;
            font-size: 0.74rem;
            cursor: pointer;
        }

        .hollow-close {
            border: 0;
            background: transparent;
            color: rgba(26, 26, 26, 0.48);
            font: inherit;
            font-size: 0.72rem;
            text-decoration: underline;
            text-underline-offset: 2px;
            cursor: pointer;
        }

        .hollow-feedback {
            min-height: 1rem;
            margin-top: 0.5rem;
            font-size: 0.72rem;
            line-height: 1.35;
            color: rgba(26, 26, 26, 0.62);
        }

        .puppy-runway {
            position: absolute;
            left: 0;
            right: 0;
            bottom: clamp(1.6rem, 4.4vh, 2.8rem);
            height: clamp(128px, 17vw, 190px);
            overflow: visible;
            z-index: 2;
        }

        .puppy-runner {
            position: absolute;
            left: 0;
            bottom: 0;
            width: clamp(82px, 12vw, 124px);
            transform-origin: 50% 70%;
            transform: translateX(min(80vw, calc(100vw - 132px)));
            transition-property: transform;
            transition-timing-function: ease-in-out;
            will-change: transform;
        }

        .puppy-button {
            width: 100%;
            border: 0;
            padding: 0;
            background: transparent;
            color: inherit;
            cursor: pointer;
            display: block;
        }

        .puppy-button:focus-visible {
            outline: 2px solid rgba(26, 26, 26, 0.55);
            outline-offset: 5px;
            border-radius: 999px;
        }

        .puppy-dog {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 570 / 586;
            transform-origin: 50% 82%;
        }

        .puppy-facing {
            position: absolute;
            inset: 0;
            transform-origin: 50% 50%;
            transform: scaleX(1);
        }

        .puppy-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
            z-index: 1;
        }

        .puppy-paw {
            position: absolute;
            bottom: 5%;
            width: 13%;
            height: 4%;
            border-bottom: 3px solid #1a1a1a;
            border-radius: 999px;
            opacity: 0.72;
            z-index: 2;
        }

        .puppy-paw.front {
            left: 34%;
        }

        .puppy-paw.back {
            left: 74%;
            animation-name: puppyPawStepReverse;
        }

        .puppy-runner.is-walking .puppy-dog {
            animation: puppyHop 0.52s ease-in-out infinite;
        }

        .puppy-runner.is-walking .puppy-paw {
            animation: puppyPawStep 0.52s ease-in-out infinite;
        }

        .puppy-runner.is-walking .puppy-paw.back {
            animation-name: puppyPawStepReverse;
        }

        .puppy-runner.is-happy .puppy-dog {
            animation: puppyHappy 0.52s ease-in-out 4;
        }

        .morse-card {
            position: absolute;
            right: 0;
            bottom: calc(100% + 0.45rem);
            width: min(238px, 72vw);
            padding: 0.78rem 0.82rem 0.72rem;
            border: 1.5px solid #1a1a1a;
            background: #faf9f5;
            color: #1a1a1a;
            border-radius: 7px;
            box-shadow: 5px 5px 0 rgba(26, 26, 26, 0.08);
            font-family: 'Courier Prime', 'Courier New', Courier, monospace;
            text-align: center;
            opacity: 0;
            transform: translateY(6px);
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .morse-card[hidden] {
            display: none;
        }

        .morse-card::after {
            content: "";
            position: absolute;
            right: 2rem;
            bottom: -0.46rem;
            width: 0.8rem;
            height: 0.8rem;
            background: #faf9f5;
            border-right: 1.5px solid #1a1a1a;
            border-bottom: 1.5px solid #1a1a1a;
            transform: rotate(45deg);
        }

        .morse-card.is-open {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .morse-card.is-wrong {
            animation: morseWiggle 0.24s ease-in-out;
        }

        .morse-card.is-correct .morse-code,
        .morse-card.is-correct .morse-form,
        .morse-card.is-correct .morse-hint-toggle,
        .morse-card.is-correct .morse-hint,
        .morse-card.is-solved .morse-code,
        .morse-card.is-solved .morse-form,
        .morse-card.is-solved .morse-hint-toggle,
        .morse-card.is-solved .morse-hint {
            display: none;
        }

        .morse-card.is-correct .morse-feedback,
        .morse-card.is-solved .morse-feedback {
            margin-top: 0.56rem;
            font-size: 1.2rem;
            color: #1a1a1a;
        }

        .morse-card p {
            margin: 0;
        }

        .morse-label {
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            color: rgba(26, 26, 26, 0.48);
            text-transform: lowercase;
        }

        .morse-code {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.32rem;
            margin-top: 0.42rem;
        }

        .morse-letter {
            display: inline-flex;
            min-width: 2.15rem;
            height: 1.24rem;
            align-items: center;
            justify-content: center;
            gap: 0.16rem;
            padding: 0.18rem 0.28rem;
            border: 1px solid rgba(26, 26, 26, 0.28);
            border-radius: 999px;
            background: #fffdf8;
        }

        .morse-dot,
        .morse-dash {
            display: inline-block;
            flex: 0 0 auto;
            background: #1a1a1a;
            border-radius: 999px;
        }

        .morse-dot {
            width: 0.22rem;
            height: 0.22rem;
        }

        .morse-dash {
            width: 0.58rem;
            height: 0.16rem;
        }

        .morse-form {
            display: flex;
            gap: 0.35rem;
            margin-top: 0.65rem;
        }

        .morse-input {
            min-width: 0;
            flex: 1;
            border: 1px solid rgba(26, 26, 26, 0.42);
            border-radius: 4px;
            background: #fffdf8;
            padding: 0.36rem 0.45rem;
            font: inherit;
            font-size: 0.82rem;
            color: #1a1a1a;
        }

        .morse-submit {
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            background: #fffdf8;
            color: #1a1a1a;
            width: 2rem;
            min-width: 2rem;
            padding: 0.36rem 0;
            font: inherit;
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
            transition: background 0.16s ease, color 0.16s ease;
        }

        .morse-submit:hover,
        .morse-submit:focus-visible {
            background: #1a1a1a;
            color: #faf9f5;
        }

        .morse-feedback {
            min-height: 1rem;
            margin-top: 0.85rem;
            font-size: 0.76rem;
            line-height: 1.3;
            color: rgba(26, 26, 26, 0.68);
        }

        .morse-hint-toggle {
            display: inline-block;
            border: 0;
            margin-top: 0.35rem;
            padding: 0;
            background: transparent;
            color: rgba(26, 26, 26, 0.42);
            font: inherit;
            font-size: 0.72rem;
            text-decoration: underline;
            text-underline-offset: 2px;
            cursor: pointer;
        }

        .morse-hint {
            display: inline-block;
            margin-top: 0.35rem;
            font-size: 0.72rem;
            color: rgba(26, 26, 26, 0.46);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .morse-hint[hidden] {
            display: none;
        }

        @keyframes puppyHop {
            0%, 100% {
                transform: translateY(0) rotate(0) scaleY(1);
            }
            45% {
                transform: translateY(-2px) rotate(0.45deg) scaleY(1.005);
            }
            72% {
                transform: translateY(1px) rotate(-0.45deg) scaleY(0.993);
            }
        }

        @keyframes puppyPawStep {
            0%, 100% {
                transform: translateX(0) scaleX(0.7);
                opacity: 0;
            }
            35% {
                transform: translateX(-4%) scaleX(0.8);
                opacity: 0.42;
            }
            65% {
                transform: translateX(8%) scaleX(0.62);
                opacity: 0.28;
            }
        }

        @keyframes puppyPawStepReverse {
            0%, 100% {
                transform: translateX(0) scaleX(0.7);
                opacity: 0;
            }
            35% {
                transform: translateX(8%) scaleX(0.58);
                opacity: 0.24;
            }
            65% {
                transform: translateX(-4%) scaleX(0.78);
                opacity: 0.42;
            }
        }

        @keyframes puppyHappy {
            0%, 100% { transform: translateY(0) rotate(0) scale(1); }
            25%      { transform: translateY(-7px) rotate(-4deg) scale(1.04); }
            50%      { transform: translateY(0) rotate(4deg) scale(1.02); }
            75%      { transform: translateY(-5px) rotate(-2deg) scale(1.04); }
        }

        @keyframes morseWiggle {
            0%, 100% { transform: translateY(0) translateX(0); }
            25%      { transform: translateY(0) translateX(-4px); }
            50%      { transform: translateY(0) translateX(4px); }
            75%      { transform: translateY(0) translateX(-2px); }
        }

        @keyframes hollowPulse {
            0%, 100% { transform: scale(1); }
            45%      { transform: scale(1.035); }
        }

        @keyframes leverPull {
            0%, 100% { transform: rotate(0deg) translate(0, 0); }
            45%      { transform: rotate(14deg) translate(3px, 5px); }
        }

        /* ── Reduced motion ── */
        @media (prefers-reduced-motion: reduce) {
            .cursor { animation: none; opacity: 1; }
            .tree-hollow-scene.is-solved .tree-image,
            .typewriter-wrap.is-lever-pulled .typewriter-lever,
            .puppy-dog,
            .puppy-paw {
                animation: none;
            }

            .puppy-runner {
                transform: translateX(min(78vw, calc(100vw - 132px)));
                transition: none;
            }

            .puppy-facing { transform: scaleX(1); }
        }

        @media (max-width: 820px) {
            .tree-hollow-scene {
                left: 0.35rem;
                bottom: 0.8rem;
                width: clamp(96px, 24vw, 136px);
                opacity: 0.92;
            }

            .hollow-panel {
                left: 0;
                bottom: 82%;
                width: min(310px, calc(100vw - 1.6rem));
            }
        }
    </style>
</head>
<body>

    <!-- ════════════════════════════════
         LANDING
    ════════════════════════════════ -->
    <div id="landing">

        <header class="site-header">
            <a href="#" class="header-mark" aria-label="violaciao — home">Viola Ciao</a>
            <nav class="site-nav" aria-label="Primary" aria-hidden="true" inert>
                <a href="bio.html" class="nav-featured">bio</a>
                <span aria-hidden="true" style="color:rgba(26,26,26,0.25)">·</span>
                <a href="mixers.html">mixers</a>
            </nav>
        </header>

        <main class="hero">
            <div class="typewriter-wrap">
                <!-- ── Typewriter illustration ── -->
                <svg class="typewriter-svg" viewBox="0 0 480 310" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <!-- Paper -->
                    <rect x="130" y="2" width="220" height="98" rx="1" fill="#faf9f5" stroke="#1a1a1a" stroke-width="1.5"/>
                    <!-- Faint guide lines on paper -->
                    <line x1="148" y1="52" x2="332" y2="52" stroke="#1a1a1a" stroke-width="0.4" opacity="0.1"/>
                    <line x1="148" y1="66" x2="332" y2="66" stroke="#1a1a1a" stroke-width="0.4" opacity="0.1"/>
                    <line x1="148" y1="80" x2="332" y2="80" stroke="#1a1a1a" stroke-width="0.4" opacity="0.1"/>
                    <!-- Roller / carriage bar -->
                    <rect x="64" y="88" width="352" height="28" rx="14" fill="#1a1a1a"/>
                    <!-- Left knob -->
                    <circle cx="50" cy="102" r="13" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="50" cy="102" r="5"  fill="#1a1a1a" opacity="0.25"/>
                    <!-- Right knob -->
                    <circle cx="430" cy="102" r="13" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="430" cy="102" r="5"  fill="#1a1a1a" opacity="0.25"/>
                    <!-- Carriage return lever -->
                    <g class="typewriter-lever">
                        <path d="M 436 93 Q 460 80 462 68" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="462" cy="66" r="5" fill="#1a1a1a"/>
                    </g>
                    <!-- Main body -->

                    <rect x="54" y="127" width="372" height="30" rx="5" fill="none" stroke="#1a1a1a" stroke-width="1"/>

                    <line x1="64" y1="120" x2="416" y2="120" stroke="#1a1a1a" stroke-width="0.6" opacity="0.35"/>

                    <circle cx="76"  cy="182" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="107" cy="182" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="138" cy="182" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="169" cy="182" r="10" stroke="#1a1a1a" stroke-width="1.5"/>

                    <circle cx="153" cy="213" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="184" cy="213" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="215" cy="213" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="246" cy="213" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="277" cy="213" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="308" cy="213" r="10" stroke="#1a1a1a" stroke-width="1.5"/>

                    <circle cx="137" cy="244" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="168" cy="244" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="199" cy="244" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="230" cy="244" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="261" cy="244" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="292" cy="244" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="323" cy="244" r="10" stroke="#1a1a1a" stroke-width="1.5"/>

                <!-- Text appears on the paper -->
                <h1 class="hero-statement" aria-label="Stay curious.">Stay&nbsp;<span id="typeword"></span><span id="period" style="opacity:0">.</span><span class="cursor" aria-hidden="true"></span></h1>

            </div>

        </main>

        <footer class="site-footer" id="say-hi">
            <p>© 2026 violaciao</p>
        </footer>

        <div class="tree-hollow-scene">
            <button class="tree-button" type="button" aria-label="Open the tree hollow riddle" aria-expanded="false">
                <img class="tree-image" src="assets/images/tree-hollow-transparent.png" alt="">
            </button>
            <section class="hollow-panel" aria-live="polite" aria-label="Tree hollow riddle game" hidden>
                <p class="hollow-title">the hollow asks</p>
                <p class="hollow-note"></p>
                <form class="hollow-form">
                    <input class="hollow-answer" type="text" autocomplete="off" spellcheck="false" aria-label="Riddle answer">
                    <div class="hollow-actions">
                        <button class="hollow-submit" type="submit">answer</button>
                        <button class="hollow-close" type="button">close</button>
                    </div>
                    <p class="hollow-feedback">The tree is thinking.</p>
                </form>
            </section>

        <div class="puppy-runway">
            <div class="puppy-runner">
                <button class="puppy-button" type="button" aria-label="Play Morse Woof with Teddy" aria-expanded="false">
                    <span class="puppy-dog" aria-hidden="true">
                        <span class="puppy-facing">
                            <span class="puppy-paw front"></span>
                            <span class="puppy-paw back"></span>
                            <img class="puppy-image" src="assets/images/teddy-transparent.png" alt="">
                        </span>
                    </span>
                </button>
                <section class="morse-card" aria-live="polite" aria-label="Morse Woof puzzle" hidden>
                    <p class="morse-label">teddy woofs</p>
                    <p class="morse-code" aria-label=""></p>
                    <p class="morse-feedback">What does Teddy say?</p>
                    <form class="morse-form">
                        <input class="morse-input" type="text" autocomplete="off" spellcheck="false" aria-label="Morse answer">
                        <button class="morse-submit" type="submit" aria-label="Submit answer">↵</button>
                    </form>
                    <button class="morse-hint-toggle" type="button">hint</button>
                    <a class="morse-hint" href="https://morse.withgoogle.com/learn/" target="_blank" rel="noopener" hidden>learn morse</a>
                </section>
            </div>
        </div>

    <!-- SVG filter: typewriter ink unevenness -->
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
        <defs>
            <filter id="ink" x="-4%" y="-10%" width="108%" height="120%">
                <!-- High-frequency noise = small-scale edge roughness like worn typeface -->
                <feTurbulence type="fractalNoise" baseFrequency="0.65 0.7" numOctaves="4" seed="11" result="noise"/>
                <!-- Tiny displacement makes each letter edge slightly irregular -->
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.75"
                    xChannelSelector="R" yChannelSelector="G"/>
            </filter>
        </defs>
    </svg>

    <script>
        const typeword = document.getElementById('typeword');
        const period   = document.getElementById('period');
        const landing = document.getElementById('landing');
        const siteNav = document.querySelector('.site-nav');
        const typewriterWrap = document.querySelector('.typewriter-wrap');
        const leverToggle = document.querySelector('.typewriter-lever-toggle');
        const puppyRunner = document.querySelector('.puppy-runner');
        const puppyFacing = document.querySelector('.puppy-facing');
        const puppyButton = document.querySelector('.puppy-button');
        const morseCard = document.querySelector('.morse-card');
        const morseCode = document.querySelector('.morse-code');
        const morseForm = document.querySelector('.morse-form');
        const morseInput = document.querySelector('.morse-input');
        const morseFeedback = document.querySelector('.morse-feedback');
        const morseHintToggle = document.querySelector('.morse-hint-toggle');
        const morseHint = document.querySelector('.morse-hint');
        const treeScene = document.querySelector('.tree-hollow-scene');
        const treeButton = document.querySelector('.tree-button');
        const hollowPanel = document.querySelector('.hollow-panel');
        const hollowForm = document.querySelector('.hollow-form');
        const hollowNote = document.querySelector('.hollow-note');
        const hollowAnswer = document.querySelector('.hollow-answer');
        const hollowClose = document.querySelector('.hollow-close');
        const hollowFeedback = document.querySelector('.hollow-feedback');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let puppyPuzzleOpen = false;
        let morseIndex = 0;
        let morseSolvedCount = 0;
        let morseAdvancing = false;
        let morseQueue = [];
        let treeHollowUnlocked = false;
        let hollowRiddleIndex = 0;
        let hollowRiddleSolvedCount = 0;
        let hollowRiddleAdvancing = false;
        let hollowRiddleSolved = false;

        const MORSE_ALPHABET = {
            a: '.-',
            b: '-...',
            c: '-.-.',
            d: '-..',
            e: '.',
            f: '..-.',
            g: '--.',
            h: '....',
            i: '..',
            j: '.---',
            k: '-.-',
            l: '.-..',
            m: '--',
            n: '-.',
            o: '---',
            p: '.--.',
            q: '--.-',
            r: '.-.',
            s: '...',
            t: '-',
            u: '..-',
            v: '...-',
            w: '.--',
            x: '-..-',
            y: '-.--',
            z: '--..'
        };

        const MORSE_PUZZLES = [
            'ciao',
            'hello',
            'happy',
            'moon',
            'star',
            'dance',
            'song',
            'dream',
            'wonder',
            'brave'
        ];
        const TREE_HOLLOW_UNLOCK_COUNT = 3;
        const HOLLOW_RIDDLES = [
            {
                clue: 'I have keys but no locks. I make letters appear without a mouth. Who am I?',
                answer: 'typewriter'
            }
        ];
        const HOLLOW_SOLVED_TITLE = 'The hollow opens.';
        const HOLLOW_SOLVED_CLUE = 'The paths are held in the typewriter’s return lever.';


        // ─── Typewriter ───────────────────────────────────────
        const WORDS       = ['curious', 'playful', 'in motion', 'open'];
        const TYPE_MS     = 155;   // ms per character typed
        const DEL_MS      = 90;    // ms per character deleted
        const PAUSE_TYPED = 2200;  // ms pause when word is fully typed
        const PAUSE_EMPTY = 600;   // ms pause before typing next word

        let wIndex = 0, cIndex = 0, isDeleting = false;

        function typeStep() {
            const word = WORDS[wIndex];

            if (!isDeleting) {
                period.style.opacity = '0';
                cIndex++;
                typeword.textContent = word.slice(0, cIndex);
                if (cIndex === word.length) {
                    period.style.opacity = '1';
                    isDeleting = true;
                    setTimeout(typeStep, PAUSE_TYPED);
                    return;
                }
                setTimeout(typeStep, TYPE_MS);
            } else {
                cIndex--;
                typeword.textContent = word.slice(0, cIndex);
                if (cIndex === 0) {
                    isDeleting = false;
                    wIndex = (wIndex + 1) % WORDS.length;
                    setTimeout(typeStep, PAUSE_EMPTY);
                    return;
                }
                setTimeout(typeStep, DEL_MS);
            }
        }

        function randomBetween(min, max) {
            return min + Math.random() * (max - min);
        }

        function setupNavLever() {
            if (!landing || !siteNav || !typewriterWrap || !leverToggle) return;

            leverToggle.addEventListener('click', () => {
                const navOpen = landing.classList.toggle('nav-open');
                siteNav.setAttribute('aria-hidden', String(!navOpen));
                siteNav.inert = !navOpen;
                leverToggle.setAttribute('aria-expanded', String(navOpen));

                typewriterWrap.classList.remove('is-lever-pulled');
                void typewriterWrap.offsetWidth;
                typewriterWrap.classList.add('is-lever-pulled');
            });
        }

        function puppyBounds() {
            const width = puppyRunner ? puppyRunner.offsetWidth : 124;
            const maxX = Math.max(0, window.innerWidth - width - 18);
            const rightAnchor = Math.min(window.innerWidth * 0.84, maxX);
            const span = Math.min(92, Math.max(46, window.innerWidth * 0.09));
            const minX = Math.min(rightAnchor, Math.max(window.innerWidth * 0.68, rightAnchor - span));
            return { minX, maxX: Math.max(minX, rightAnchor) };
        }

        function startPuppyWander() {
            if (!puppyRunner || !puppyFacing || reduceMotion) return;

            let { minX, maxX } = puppyBounds();
            let currentX = randomBetween(minX, maxX);
            let lastDirection = -1;

            puppyRunner.style.transform = `translateX(${currentX}px)`;
            puppyFacing.style.transform = 'scaleX(1)';

            function nextMove() {
                if (puppyPuzzleOpen) {
                    puppyRunner.classList.remove('is-walking');
                    window.setTimeout(nextMove, 900);
                    return;
                }

                ({ minX, maxX } = puppyBounds());
                currentX = Math.min(maxX, Math.max(minX, currentX));

                const keepDirection = Math.random() < 0.46;
                const direction = keepDirection ? lastDirection : (Math.random() < 0.5 ? -1 : 1);
                const range = Math.max(20, maxX - minX);
                const distance = randomBetween(12, Math.min(58, range));
                let targetX = currentX + direction * distance;

                if (targetX <= minX || targetX >= maxX) {
                    targetX = Math.min(maxX, Math.max(minX, targetX));
                    lastDirection = targetX > currentX ? 1 : -1;
                } else {
                    lastDirection = direction;
                }

                if (Math.abs(targetX - currentX) < 8) {
                    targetX = randomBetween(minX, maxX);
                    lastDirection = targetX > currentX ? 1 : -1;
                }

                puppyFacing.style.transform = lastDirection > 0 ? 'scaleX(-1)' : 'scaleX(1)';

                const duration = randomBetween(700, 1800);
                puppyRunner.classList.add('is-walking');
                puppyRunner.style.transitionDuration = `${duration}ms`;
                puppyRunner.style.transform = `translateX(${targetX}px) translateY(${Math.round(randomBetween(-2, 2))}px)`;

                window.setTimeout(() => {
                    currentX = targetX;
                    puppyRunner.classList.remove('is-walking');
                    const pause = randomBetween(450, 3200);
                    window.setTimeout(nextMove, pause);
                }, duration);
            }

            window.setTimeout(nextMove, randomBetween(600, 2200));
        }

        function normalizeMorseAnswer(value) {
            return value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function morseDescription(code) {
            return code
                .split('')
                .map((mark) => mark === '.' ? 'dot' : 'dash')
                .join(' ');
        }

        function shuffledMorsePuzzles() {
            const puzzles = [...MORSE_PUZZLES];

            for (let i = puzzles.length - 1; i > 0; i -= 1) {
                const j = Math.floor(Math.random() * (i + 1));
                [puzzles[i], puzzles[j]] = [puzzles[j], puzzles[i]];
            }

            return puzzles;
        }

        function renderMorsePuzzle() {
            if (!morseCode) return;

            const answer = morseQueue[morseIndex];
            const letters = answer.split('').map((letter) => MORSE_ALPHABET[letter]);

            morseCode.textContent = '';
            morseCode.setAttribute('aria-label', letters.map(morseDescription).join(', '));

            letters.forEach((code) => {
                const letterElement = document.createElement('span');
                letterElement.className = 'morse-letter';
                letterElement.setAttribute('aria-hidden', 'true');

                code.split('').forEach((mark) => {
                    const markElement = document.createElement('span');
                    markElement.className = mark === '.' ? 'morse-dot' : 'morse-dash';
                    letterElement.appendChild(markElement);
                });

                morseCode.appendChild(letterElement);
            });
        }

        function advanceMorsePuzzle() {
            morseSolvedCount += 1;
            morseAdvancing = false;
            morseCard.classList.remove('is-correct');

            if (!treeHollowUnlocked && morseSolvedCount >= TREE_HOLLOW_UNLOCK_COUNT) {
                treeHollowUnlocked = true;
                if (treeScene) treeScene.classList.add('is-unlocked');
            }

            if (morseSolvedCount >= MORSE_PUZZLES.length) {
                morseCard.classList.add('is-solved');
                morseFeedback.textContent = 'Teddy has no more woofs.';
                if (morseHint) morseHint.hidden = true;
                if (morseHintToggle) morseHintToggle.hidden = true;
                return;
            }

            morseIndex = (morseIndex + 1) % MORSE_PUZZLES.length;
            renderMorsePuzzle();
            morseFeedback.textContent = 'What does Teddy say?';
            if (morseInput) morseInput.value = '';
            if (morseHint) morseHint.hidden = true;
            if (morseHintToggle) morseHintToggle.hidden = false;
        }

        function setMorseOpen(open) {
            if (!morseCard) return;
            puppyPuzzleOpen = open;
            if (puppyButton) puppyButton.setAttribute('aria-expanded', String(open));
            if (open) morseCard.hidden = false;
            requestAnimationFrame(() => morseCard.classList.toggle('is-open', open));
            if (!open) {
                window.setTimeout(() => {
                    if (!morseCard.classList.contains('is-open')) morseCard.hidden = true;
                }, 190);
            }
            if (open && morseInput) {
                window.setTimeout(() => morseInput.focus(), 80);
            }
        }

        function resetMorsePuzzle() {
            if (!morseCard || !morseFeedback) return;

            if (morseAdvancing) return;

            if (morseQueue.length === 0) {
                morseQueue = shuffledMorsePuzzles();
                morseIndex = 0;
                morseSolvedCount = 0;
            }

            morseCard.classList.remove('is-correct', 'is-wrong');

            if (morseSolvedCount >= MORSE_PUZZLES.length) {
                morseCard.classList.add('is-solved');
                morseFeedback.textContent = 'Teddy has no more woofs.';
                if (morseHint) morseHint.hidden = true;
                if (morseHintToggle) morseHintToggle.hidden = true;
                return;
            }

            morseCard.classList.remove('is-solved');
            renderMorsePuzzle();
            morseFeedback.textContent = 'What does Teddy say?';
            if (morseInput) morseInput.value = '';
            if (morseHint) morseHint.hidden = true;
            if (morseHintToggle) morseHintToggle.hidden = false;
        }

        function setupMorseWoof() {
            if (!puppyButton || !morseForm || !morseInput || !morseFeedback || !puppyRunner) return;

            puppyButton.addEventListener('click', () => {
                const isOpen = morseCard && morseCard.classList.contains('is-open');
                setMorseOpen(!isOpen);
                if (!isOpen) {
                    resetMorsePuzzle();
                }
            });

            if (morseHintToggle && morseHint) {
                morseHintToggle.addEventListener('click', () => {
                    morseHint.hidden = false;
                    morseHintToggle.hidden = true;
                    morseFeedback.textContent = 'Use the dictionary, then come back to Teddy.';
                });
            }

            morseForm.addEventListener('submit', (event) => {
                event.preventDefault();
                if (morseAdvancing) return;

                const answer = normalizeMorseAnswer(morseInput.value);
                const expectedAnswer = morseQueue[morseIndex];

                if (answer === expectedAnswer) {
                    morseAdvancing = true;
                    morseCard.classList.remove('is-wrong');
                    morseCard.classList.add('is-correct');
                    morseFeedback.textContent = `${expectedAnswer}!`;
                    puppyRunner.classList.remove('is-happy');
                    void puppyRunner.offsetWidth;
                    puppyRunner.classList.add('is-happy');
                    window.setTimeout(() => puppyRunner.classList.remove('is-happy'), 2300);
                    window.setTimeout(advanceMorsePuzzle, 2400);
                    return;
                }

                morseCard.classList.remove('is-wrong');
                void morseCard.offsetWidth;
                morseCard.classList.add('is-wrong');

                const nudges = [
                    'Teddy tilts his head. Keep guessing.',
                    'Not quite. Try reading one letter at a time.',
                    'Close your eyes and count the dashes.',
                    'Teddy waits by the typewriter.'
                ];
                morseFeedback.textContent = nudges[Math.floor(Math.random() * nudges.length)];
            });
        }

        function setHollowOpen(open) {
            if (!hollowPanel) return;
            if (treeButton) treeButton.setAttribute('aria-expanded', String(open));
            if (open) hollowPanel.hidden = false;
            requestAnimationFrame(() => hollowPanel.classList.toggle('is-open', open));
            if (!open) {
                window.setTimeout(() => {
                    if (!hollowPanel.classList.contains('is-open')) hollowPanel.hidden = true;
                }, 190);
            }
            if (open && hollowAnswer) {
                window.setTimeout(() => hollowAnswer.focus(), 80);
            }
        }

        function normalizeHollowAnswer(value) {
            return value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function renderHollowRiddle() {
            if (!hollowNote || !hollowFeedback) return;

            if (hollowRiddleSolved) {
                hollowPanel.classList.add('is-complete');
                hollowNote.textContent = HOLLOW_SOLVED_TITLE;
                hollowFeedback.textContent = HOLLOW_SOLVED_CLUE;
                return;
            }

            const riddle = HOLLOW_RIDDLES[hollowRiddleIndex];
            hollowNote.textContent = riddle.clue;
            hollowFeedback.textContent = 'Answer the tree to open the next ring.';
            if (hollowAnswer) hollowAnswer.value = '';
        }

        function resetHollowRiddles() {
            if (!hollowPanel) return;

            hollowPanel.classList.toggle('is-complete', hollowRiddleSolved);
            hollowPanel.classList.remove('is-wrong');
            hollowRiddleIndex = 0;
            hollowRiddleSolvedCount = hollowRiddleSolved ? HOLLOW_RIDDLES.length : 0;
            hollowRiddleAdvancing = false;
            renderHollowRiddle();
        }

        function advanceHollowRiddle() {
            hollowRiddleSolvedCount += 1;
            hollowRiddleAdvancing = false;

            if (hollowRiddleSolvedCount >= HOLLOW_RIDDLES.length) {
                hollowRiddleSolved = true;
                hollowPanel.classList.add('is-complete');
                if (hollowNote) hollowNote.textContent = HOLLOW_SOLVED_TITLE;
                if (hollowFeedback) hollowFeedback.textContent = HOLLOW_SOLVED_CLUE;
                if (treeScene) {
                    treeScene.classList.remove('is-solved');
                    void treeScene.offsetWidth;
                    treeScene.classList.add('is-solved');
                }
                return;
            }

            hollowRiddleIndex = (hollowRiddleIndex + 1) % HOLLOW_RIDDLES.length;
            renderHollowRiddle();
        }

        function setupTreeHollow() {
            if (!treeButton || !hollowForm || !hollowFeedback || !hollowAnswer) return;

            treeButton.addEventListener('click', () => {
                const isOpen = hollowPanel && hollowPanel.classList.contains('is-open');
                setHollowOpen(!isOpen);
                if (!isOpen) {
                    resetHollowRiddles();
                }
            });

            if (hollowClose) {
                hollowClose.addEventListener('click', () => setHollowOpen(false));
            }

            hollowForm.addEventListener('submit', (event) => {
                event.preventDefault();
                if (hollowRiddleAdvancing || hollowRiddleSolvedCount >= HOLLOW_RIDDLES.length) return;

                const answer = normalizeHollowAnswer(hollowAnswer.value);
                const expectedAnswer = HOLLOW_RIDDLES[hollowRiddleIndex].answer;

                if (answer === normalizeHollowAnswer(expectedAnswer)) {
                    hollowRiddleAdvancing = true;
                    hollowPanel.classList.add('is-complete');
                    hollowNote.textContent = `${expectedAnswer}.`;
                    hollowFeedback.textContent = 'The tree lets the word through.';
                    window.setTimeout(advanceHollowRiddle, 1600);
                    return;
                }

                hollowPanel.classList.remove('is-wrong');
                void hollowPanel.offsetWidth;
                hollowPanel.classList.add('is-wrong');
                hollowFeedback.textContent = 'Not that ring. Try another word.';
            });
        }

        // Respect prefers-reduced-motion
        if (reduceMotion) {
            typeword.textContent = 'curious';
        } else {
            setTimeout(typeStep, 400);
            startPuppyWander();
        }

        setupNavLever();
        setupMorseWoof();
        setupTreeHollow();
    </script>

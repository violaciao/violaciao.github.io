<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="violaciao — singer, dancer, and AI consultant in New York.">
    <meta property="og:title" content="violaciao">
    <meta property="og:description" content="Singer, dancer, and AI consultant in New York.">
    <meta property="og:type" content="website">
    <title>violaciao</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Caveat       — handwriting/script font for the wordmark only
      Inter        — clean grotesk for everything else
    -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Fira+Code:wght@400;500&family=Inter:ital,wght@0,300;0,400;1,300&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ── Reset ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; }
        body {
            height: 100%;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        a { color: inherit; text-decoration: none; }


        /* ═══════════════════════════════════════════
           LANDING PAGE
        ═══════════════════════════════════════════ */

        #landing {
            min-height: 100vh;
            min-height: 100dvh;
            background: #f3f1ec;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
        }


        /* ── Header ── */

        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(1.1rem, 3.5vh, 2.2rem) clamp(1.4rem, 5vw, 3.8rem);
            flex-shrink: 0;
        }

        .header-mark {
            font-family: 'Manrope', sans-serif;
            font-size: clamp(1.8rem, 2.3vw, 2.5rem);
            font-weight: 500;
            color: #1a1a1a;
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .site-nav {
            display: flex;
            gap: clamp(0.6rem, 1.2vw, 1rem);
            justify-content: center;
            align-items: center;
        }

        .site-nav a {
            font-family: 'Courier Prime', 'Courier New', Courier, monospace;
            font-size: clamp(0.78rem, 1.1vw, 0.9rem);
            letter-spacing: 0.06em;
            color: rgba(26, 26, 26, 0.45);
            transition: color 0.2s;
        }

        .site-nav a:hover {
            color: #1a1a1a;
            text-decoration: underline;
            text-underline-offset: 3px;
        }


        /* ── Hero ── */

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 clamp(1rem, 5vw, 3rem);
            gap: clamp(1rem, 2.5vh, 1.8rem);
        }

        /* Typewriter illustration container */
        .typewriter-wrap {
            position: relative;
            width: clamp(300px, 62vw, 560px);
            flex-shrink: 0;
        }

        .typewriter-svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Hero text — sits on the paper */
        .hero-statement {
            position: absolute;
            /* paper center: x=240/480=50%, y=58/310=18.7% */
            top: 19%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            white-space: nowrap;
            font-family: 'Courier Prime', 'Courier New', Courier, monospace;
            font-size: clamp(0.62rem, 1.85vw, 1rem);
            font-weight: 400;
            letter-spacing: 0.02em;
            line-height: 1.3;
            color: #231a0e;   /* warm dark ink */
            filter: url(#ink);
            text-shadow:
                0.4px  0.3px 0 rgba(35,26,14,0.12),
                -0.3px 0.2px 0 rgba(35,26,14,0.08),
                0.2px -0.2px 0 rgba(35,26,14,0.06);
        }

        #typeword { display: inline; }

        /* Blinking bar cursor */
        .cursor {
            display: inline-block;
            width: 0.06em;
            min-width: 1px;
            height: 0.8em;
            background: #231a0e;
            margin: 0 0.03em 0 0.02em;
            vertical-align: -0.04em;
            animation: blink 0.95s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }


        /* ── Footer ── */

        .site-footer {
            flex-shrink: 0;
            padding: clamp(0.9rem, 2.5vh, 1.5rem) clamp(1.4rem, 5vw, 3.8rem);
            font-size: 0.72rem;
            color: rgba(26, 26, 26, 0.28);
            letter-spacing: 0.06em;
            text-align: center;
        }


        /* ── Reduced motion ── */
        @media (prefers-reduced-motion: reduce) {
            .cursor { animation: none; opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- ════════════════════════════════
         LANDING
    ════════════════════════════════ -->
    <div id="landing">

        <header class="site-header">
            <a href="#" class="header-mark" aria-label="violaciao — home">Viola Ciao</a>
            <nav class="site-nav" aria-label="Primary">
                <a href="bio.html">bio</a>
                <span aria-hidden="true" style="color:rgba(26,26,26,0.25)">·</span>
                <a href="mixers.html">mixers</a>
                <span aria-hidden="true" style="color:rgba(26,26,26,0.25)">·</span>
                <a href="writing/">writing</a>
            </nav>
        </header>

        <main class="hero">
            <a href="bio.html" class="typewriter-wrap" style="cursor:pointer;display:block;" aria-label="Go to bio">
                <!-- ── Typewriter illustration ── -->
                <svg class="typewriter-svg" viewBox="0 0 480 310" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <!-- Paper -->
                    <rect x="130" y="2" width="220" height="98" rx="1" fill="#faf9f5" stroke="#1a1a1a" stroke-width="1.5"/>
                    <!-- Faint guide lines on paper -->
                    <line x1="148" y1="52" x2="332" y2="52" stroke="#1a1a1a" stroke-width="0.4" opacity="0.1"/>
                    <line x1="148" y1="66" x2="332" y2="66" stroke="#1a1a1a" stroke-width="0.4" opacity="0.1"/>
                    <line x1="148" y1="80" x2="332" y2="80" stroke="#1a1a1a" stroke-width="0.4" opacity="0.1"/>
                    <!-- Roller / carriage bar -->
                    <rect x="64" y="88" width="352" height="28" rx="14" fill="#1a1a1a"/>
                    <!-- Left knob -->
                    <circle cx="50" cy="102" r="13" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="50" cy="102" r="5"  fill="#1a1a1a" opacity="0.25"/>
                    <!-- Right knob -->
                    <circle cx="430" cy="102" r="13" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="430" cy="102" r="5"  fill="#1a1a1a" opacity="0.25"/>
                    <!-- Carriage return lever -->
                    <path d="M 436 93 Q 460 80 462 68" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="462" cy="66" r="5" fill="#1a1a1a"/>
                    <!-- Main body -->
                    <rect x="32" y="114" width="416" height="184" rx="14" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
                    <!-- Top panel / ribbon housing -->
                    <rect x="54" y="127" width="372" height="30" rx="5" fill="none" stroke="#1a1a1a" stroke-width="1"/>
                    <!-- Platen guide (type line) -->
                    <line x1="64" y1="120" x2="416" y2="120" stroke="#1a1a1a" stroke-width="0.6" opacity="0.35"/>
                    <!-- Keys Row 1 (10 keys) -->
                    <circle cx="76"  cy="182" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="107" cy="182" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="138" cy="182" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="169" cy="182" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="200" cy="182" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="231" cy="182" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="262" cy="182" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="293" cy="182" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="324" cy="182" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="355" cy="182" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <!-- Keys Row 2 (9 keys) -->
                    <circle cx="91"  cy="213" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="122" cy="213" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="153" cy="213" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="184" cy="213" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="215" cy="213" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="246" cy="213" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="277" cy="213" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="308" cy="213" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="339" cy="213" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <!-- Keys Row 3 (8 keys) -->
                    <circle cx="106" cy="244" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="137" cy="244" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="168" cy="244" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="199" cy="244" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="230" cy="244" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="261" cy="244" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="292" cy="244" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="323" cy="244" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
                    <!-- Spacebar -->
                    <rect x="148" y="265" width="184" height="18" rx="6" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
                </svg>

                <!-- Text appears on the paper -->
                <h1 class="hero-statement" aria-label="Stay curious.">Stay&nbsp;<span id="typeword"></span><span id="period" style="opacity:0">.</span><span class="cursor" aria-hidden="true"></span></h1>
            </a>

        </main>

        <footer class="site-footer" id="say-hi">
            <p>© 2026 violaciao</p>
        </footer>

    </div>


    <!-- SVG filter: typewriter ink unevenness -->
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
        <defs>
            <filter id="ink" x="-4%" y="-10%" width="108%" height="120%">
                <!-- High-frequency noise = small-scale edge roughness like worn typeface -->
                <feTurbulence type="fractalNoise" baseFrequency="0.65 0.7" numOctaves="4" seed="11" result="noise"/>
                <!-- Tiny displacement makes each letter edge slightly irregular -->
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.75"
                    xChannelSelector="R" yChannelSelector="G"/>
            </filter>
        </defs>
    </svg>

    <script>
        const typeword = document.getElementById('typeword');
        const period   = document.getElementById('period');


        // ─── Typewriter ───────────────────────────────────────
        const WORDS       = ['curious', 'playful', 'in motion', 'open'];
        const TYPE_MS     = 155;   // ms per character typed
        const DEL_MS      = 90;    // ms per character deleted
        const PAUSE_TYPED = 2200;  // ms pause when word is fully typed
        const PAUSE_EMPTY = 600;   // ms pause before typing next word

        let wIndex = 0, cIndex = 0, isDeleting = false;

        function typeStep() {
            const word = WORDS[wIndex];

            if (!isDeleting) {
                period.style.opacity = '0';
                cIndex++;
                typeword.textContent = word.slice(0, cIndex);
                if (cIndex === word.length) {
                    period.style.opacity = '1';
                    isDeleting = true;
                    setTimeout(typeStep, PAUSE_TYPED);
                    return;
                }
                setTimeout(typeStep, TYPE_MS);
            } else {
                cIndex--;
                typeword.textContent = word.slice(0, cIndex);
                if (cIndex === 0) {
                    isDeleting = false;
                    wIndex = (wIndex + 1) % WORDS.length;
                    setTimeout(typeStep, PAUSE_EMPTY);
                    return;
                }
                setTimeout(typeStep, DEL_MS);
            }
        }

        // Respect prefers-reduced-motion
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            typeword.textContent = 'curious';
        } else {
            setTimeout(typeStep, 400);
        }
    </script>

</body>
</html>
